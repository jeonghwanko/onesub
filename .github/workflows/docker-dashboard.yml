name: Publish dashboard Docker image

on:
  push:
    branches: [master]
    paths:
      # Keep this list in sync with everything packages/dashboard/Dockerfile
      # copies. The image runs the packageManager-pinned install against the
      # ROOT lockfile, so a dependency bump that touches nothing under packages/
      # still changes what
      # ships — omitting package-lock.json here silently leaves the published
      # image on the old dependency set.
      - 'packages/dashboard/**'
      - 'packages/shared/**'
      - 'packages/cli/package.json'
      - 'packages/mcp-server/package.json'
      - 'packages/providers/package.json'
      - 'packages/sdk/package.json'
      - 'packages/server/package.json'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'tsconfig.base.json'
      - 'scripts/check-toolchain.mjs'
      - '.dockerignore'
      - '.github/workflows/docker-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: docker-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jeonghwanko/onesub-dashboard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
